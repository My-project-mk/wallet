spring:
  application:
    name: wallet
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/wallet}
    username: ${DB_USERNAME:wallet}
    password: ${DB_PASSWORD:wallet}
    hikari:
      connection-init-sql: SET lock_timeout = '5s'
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

springdoc:
  api-docs:
    path: /wallet-service-docs
  packages-to-scan: com.java.wallet.web

wallet:
  idempotency:
    lease-duration: 30s
